pekko {
  loglevel = INFO
  log-config-on-start = off

  actor {
    provider = cluster
    serialization-bindings {
      "ir.sharifi.townpower.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    # overridden by Main via PEKKO_HOSTNAME / PEKKO_BIND_HOSTNAME / argv port
    canonical.hostname = "127.0.0.1"
    canonical.port = 0
    bind.hostname = "127.0.0.1"
    bind.port = 0
  }

  cluster {
    # overridden by Main via PEKKO_SEEDS (comma-separated)
    seed-nodes = [
      "pekko://town-power@127.0.0.1:2551",
      "pekko://town-power@127.0.0.1:2552"
    ]

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    sharding {
      number-of-shards = 18
      # ~373 محله, meter hits ~24/s → full cycle ~15s; 8s idle = sleep between visits (Actor Lab)
      passivate-idle-entity-after = 8s
      rebalance-interval = 5s
    }
  }

  coordinated-shutdown.exit-jvm = on
}

town {
  # Tehran: 22 regions; entities = real محله (~373)
  # Load: P = P_base · f_diurnal(h) · f_temp(T) · m_scenario + ε  (MW)
  districts = 22
  district-capacity-mw = 220
  overload-stable-for = 3s
  blackout-cooldown = 12s
  cascade-bump-ratio = 0.12
  meter-tick = 250ms
  http-base-port = 9551
  stress-multiplier = 2.4
  # LoadModel
  load-base-mw = 8.5
  load-north-boost-mw = 4.0
  load-temp-ref-c = 24.0
  load-temp-alpha = 0.035
  load-noise-sigma-mw = 1.0
  # Supervisor DSM: shed heavy kids before cascade; restore when siblings healthy
  supervisor-shed-ratio = 0.90
  supervisor-restore-ratio = 0.65
  supervisor-shed-per-tick = 2
}
