<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تهران برق — Actors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <style>
    .work { min-height: 100%; overflow: auto; display: flex; flex-direction: column; }
    .body { padding: var(--pad); display: grid; gap: var(--gap); flex: 1; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px var(--pad); border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .grow { flex: 1; }
    select.ctl, input.ctl {
      height: 32px; padding: 0 10px; border-radius: var(--radius-control);
      border: 1px solid var(--control); background: var(--raised); color: var(--text);
      font-family: var(--mono); font-size: var(--fs-small);
    }
    input.ctl { min-width: 160px; }
    .note {
      font-size: var(--fs-small); color: var(--warning); font-family: var(--mono);
      padding: 0 var(--pad) 8px;
    }
    .nodes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 var(--pad) 8px; }
    .node-pill {
      font-family: var(--mono); font-size: 11px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted);
    }
    .node-pill.ok { color: var(--positive); border-color: var(--positive); }
    .node-pill.bad { color: var(--negative); border-color: var(--negative); }
    .chart {
      display: grid; gap: 6px; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
    }
    .bar-row {
      display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center;
      font-family: var(--mono); font-size: 11px;
    }
    .bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); direction: ltr; text-align: left; }
    .bar-track { height: 10px; background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
    .bar-track > i { display: block; height: 100%; background: var(--chart); width: 0; }
    .bar-track > i.cpu { background: var(--warning); }
    .bar-track > i.ram { background: var(--positive); }
    .scroll { overflow: auto; max-height: 520px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }
    table.grid { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: var(--fs-small); }
    table.grid th, table.grid td {
      text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap;
    }
    table.grid th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; }
    table.grid th:hover { color: var(--text); }
    table.grid td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="ناوبری">
    <div class="mark" title="تهران برق">TP</div>
    <a href="/city" title="نقشه شهر">MAP</a>
    <a href="/viewer" title="شاردها">SHD</a>
    <a href="/dashboard" title="کلاستر">CLS</a>
    <a href="/jvm" title="JVM">JVM</a>
    <a href="/actors" aria-current="page" title="Actors">ACT</a>
    <a href="/lab" title="Actor Lab">LAB</a>
    <div class="spacer"></div>
  </nav>
  <div class="work">
    <header class="top">
      <div>
        <h1>Actors · cluster</h1>
        <div class="sub" id="hdr-sub">هر نود /api/actors/local · اینجا merge</div>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="label">actors</span><span class="value" id="k-n">—</span></div>
        <div class="kpi"><span class="label">nodes</span><span class="value" id="k-nodes">—</span></div>
        <div class="kpi"><span class="label">tick</span><span class="value" id="k-tick">—</span></div>
      </div>
    </header>
    <div class="note">proxy: msg/s ≈ busy · avgHandleNs ≈ CPU · approxStateBytes ≈ RAM — نه OS واقعی</div>
    <div class="nodes" id="nodes"></div>
    <div class="controls">
      <input class="ctl" id="q" type="search" placeholder="filter id / node…" dir="ltr"/>
      <select class="ctl" id="node-filter"><option value="ALL">all nodes</option></select>
      <select class="ctl" id="sort">
        <option value="msgRate">sort: msg/s</option>
        <option value="avgHandleNs">sort: avgHandleNs</option>
        <option value="approxStateBytes">sort: stateBytes</option>
        <option value="msgCount">sort: msgCount</option>
        <option value="watts">sort: watts</option>
      </select>
      <select class="ctl" id="interval">
        <option value="1000">1s</option>
        <option value="2000" selected>2s</option>
        <option value="5000">5s</option>
      </select>
      <div class="grow"></div>
      <button type="button" class="btn" id="pause">Pause</button>
      <button type="button" class="btn" id="refresh">Refresh</button>
    </div>
    <div class="body">
      <div class="split">
        <div class="chart">
          <div class="small muted">Top busy (msg/s)</div>
          <div id="chart-cpu"></div>
        </div>
        <div class="chart">
          <div class="small muted">Top stateBytes (proxy RAM)</div>
          <div id="chart-ram"></div>
        </div>
      </div>
      <div class="scroll">
        <table class="grid">
          <thead>
            <tr>
              <th data-k="id">id</th>
              <th data-k="memberId">node</th>
              <th data-k="shardId">shard</th>
              <th data-k="status">status</th>
              <th data-k="msgRate">msg/s</th>
              <th data-k="avgHandleNs">avg ns</th>
              <th data-k="approxStateBytes">state B</th>
              <th data-k="msgCount">msgs</th>
              <th data-k="watts">MW</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const state = {
    data: null,
    prev: new Map(),
    paused: false,
    intervalMs: 2000,
    timer: null,
    filter: "",
    nodeFilter: "ALL",
    sort: "msgRate"
  };
  const $ = (id) => document.getElementById(id);
  const shortNode = (m) => {
    if (!m) return "—";
    const at = m.indexOf("@");
    return at >= 0 ? m.slice(at + 1) : m;
  };
  const fmtNs = (ns) => {
    if (ns == null) return "—";
    if (ns < 1000) return ns + "ns";
    if (ns < 1e6) return (ns / 1e3).toFixed(1) + "µs";
    return (ns / 1e6).toFixed(2) + "ms";
  };

  $("pause").addEventListener("click", () => {
    state.paused = !state.paused;
    $("pause").textContent = state.paused ? "Resume" : "Pause";
    $("pause").classList.toggle("on", state.paused);
    schedule();
  });
  $("refresh").addEventListener("click", () => tick());
  $("interval").addEventListener("change", (e) => { state.intervalMs = Number(e.target.value); schedule(); });
  $("q").addEventListener("input", (e) => { state.filter = e.target.value.trim().toLowerCase(); render(); });
  $("node-filter").addEventListener("change", (e) => { state.nodeFilter = e.target.value; render(); });
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  document.querySelectorAll("th[data-k]").forEach((th) => {
    th.addEventListener("click", () => { state.sort = th.dataset.k; $("sort").value = state.sort; render(); });
  });

  function schedule() {
    if (state.timer) clearInterval(state.timer);
    state.timer = null;
    if (!state.paused) state.timer = setInterval(tick, state.intervalMs);
  }

  async function tick() {
    try {
      const r = await fetch("/api/actors", { cache: "no-store" });
      const j = await r.json();
      if (j.error) throw new Error("api error");
      const nextPrev = new Map();
      const now = j.ts || Date.now();
      (j.actors || []).forEach((a) => {
        const key = a.memberId + "|" + a.id;
        const old = state.prev.get(key);
        let msgRate = 0;
        if (old && now > old.ts && a.msgCount >= old.msgCount) {
          msgRate = ((a.msgCount - old.msgCount) * 1000) / (now - old.ts);
        }
        a.msgRate = msgRate;
        nextPrev.set(key, { msgCount: a.msgCount, ts: now });
      });
      state.prev = nextPrev;
      state.data = j;
      render();
    } catch (e) {
      $("hdr-sub").textContent = "fetch /api/actors failed";
      $("k-tick").textContent = "err";
    }
  }

  function rows() {
    const j = state.data;
    if (!j) return [];
    let list = (j.actors || []).slice();
    if (state.nodeFilter !== "ALL") list = list.filter((a) => shortNode(a.memberId) === state.nodeFilter);
    if (state.filter) {
      list = list.filter((a) =>
        (a.id || "").toLowerCase().includes(state.filter) ||
        (a.name || "").toLowerCase().includes(state.filter) ||
        shortNode(a.memberId).toLowerCase().includes(state.filter) ||
        String(a.shardId).includes(state.filter)
      );
    }
    const k = state.sort;
    list.sort((a, b) => {
      const av = a[k] == null ? 0 : a[k];
      const bv = b[k] == null ? 0 : b[k];
      if (typeof av === "string") return String(av).localeCompare(String(bv));
      return bv - av;
    });
    return list;
  }

  function renderBars(el, list, key, cls) {
    const top = list.slice(0, 12);
    const max = Math.max(1, ...top.map((a) => Number(a[key]) || 0));
    el.innerHTML = top.map((a) => {
      const v = Number(a[key]) || 0;
      const pct = (100 * v) / max;
      const label = a.id + "@" + shortNode(a.memberId);
      const shown = key === "msgRate" ? v.toFixed(2) + "/s"
        : key === "avgHandleNs" ? fmtNs(v)
        : v;
      return "<div class='bar-row'><div class='lab' title='" + label + "'>" + label +
        "</div><div class='bar-track'><i class='" + cls + "' style='width:" + pct.toFixed(1) +
        "%'></i></div><div>" + shown + "</div></div>";
    }).join("") || "<div class='muted small'>no data</div>";
  }

  function render() {
    const j = state.data;
    if (!j) return;
    $("k-n").textContent = j.actorCount != null ? j.actorCount : (j.actors || []).length;
    $("k-nodes").textContent = j.nodeCount != null ? j.nodeCount : (j.nodes || []).length;
    $("k-tick").textContent = new Date(j.ts).toLocaleTimeString("fa-IR");
    $("hdr-sub").textContent = j.self + " · fan-out /api/actors/local";

    const nf = $("node-filter");
    const cur = state.nodeFilter;
    const nodeNames = ["ALL", ...new Set((j.actors || []).map((a) => shortNode(a.memberId)))];
    nf.innerHTML = nodeNames.map((n) =>
      "<option value='" + n + "'" + (n === cur ? " selected" : "") + ">" +
      (n === "ALL" ? "all nodes" : n) + "</option>"
    ).join("");

    $("nodes").innerHTML = (j.nodes || []).map((n) => {
      const cls = n.ok ? "ok" : "bad";
      const label = shortNode(n.address) + (n.ok ? " · " + n.liveActors : " · " + (n.error || "fail"));
      return "<div class='node-pill " + cls + "' title='" + (n.url || n.source || "") + "'>" + label + "</div>";
    }).join("");

    const list = rows();
    renderBars($("chart-cpu"), list.slice().sort((a, b) => (b.msgRate || 0) - (a.msgRate || 0)), "msgRate", "cpu");
    renderBars($("chart-ram"), list.slice().sort((a, b) => (b.approxStateBytes || 0) - (a.approxStateBytes || 0)), "approxStateBytes", "ram");

    $("tbody").innerHTML = list.map((a) =>
      "<tr>" +
      "<td class='name' title='" + (a.name || "") + "'>" + a.id + "</td>" +
      "<td>" + shortNode(a.memberId) + "</td>" +
      "<td>" + a.shardId + "</td>" +
      "<td>" + a.status + "</td>" +
      "<td>" + (a.msgRate || 0).toFixed(2) + "</td>" +
      "<td>" + fmtNs(a.avgHandleNs) + "</td>" +
      "<td>" + a.approxStateBytes + "</td>" +
      "<td>" + a.msgCount + "</td>" +
      "<td>" + (a.watts == null ? "—" : Number(a.watts).toFixed(1)) + "</td>" +
      "</tr>"
    ).join("") || "<tr><td colspan='9' class='muted'>no live actors yet</td></tr>";
  }

  tick();
  schedule();
})();
</script>
</body>
</html>
