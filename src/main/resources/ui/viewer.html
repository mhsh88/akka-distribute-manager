<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تهران برق — Shards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <style>
    .work { display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
    .body {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--gap);
      padding: var(--pad);
      flex: 1;
      min-height: 0;
    }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--gap);
      align-content: start;
    }
    .shard-row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: right;
      color: inherit;
      cursor: pointer;
      min-height: 52px;
      border-bottom: 1px solid var(--rule);
    }
    .shard-row:last-child { border-bottom: none; }
    .shard-row:hover { background: var(--raised); }
    .shard-row.sel { background: var(--raised); }
    .shard-row .sid { font-family: var(--mono); font-size: var(--fs-small); color: var(--muted); }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: transparent;
      display: flex;
      overflow: hidden;
      max-width: 88%;
    }
    .bar i { display: block; height: 100%; }
    .bar .ok { background: var(--chart); }
    .bar .bo { background: var(--negative); }
    .bar .sh { background: var(--warning); }
    .cnt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
    .entity {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--rule);
      font-size: var(--fs-small);
      min-height: 44px;
      align-items: center;
    }
    .entity:last-child { border-bottom: none; }
    .entity .id { font-family: var(--mono); color: var(--muted); font-size: 11px; }
    .entity .mw { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--chart); }
    .entity.migrated {
      background: rgba(61, 125, 214, 0.18);
      box-shadow: inset 3px 0 0 var(--chart);
      animation: migPulse 1.2s ease-out 2;
    }
    @keyframes migPulse {
      0% { background: rgba(61, 125, 214, 0.35); }
      100% { background: rgba(61, 125, 214, 0.12); }
    }
    .mig-tag {
      color: var(--chart); font-family: var(--mono); font-size: 10px; margin-right: 4px;
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 6px;
      font-family: var(--mono);
    }
    .pill.O { background: #1a2a1c; color: var(--positive); }
    .pill.B { background: #2a1515; color: var(--negative); }
    .pill.S { background: #2a2410; color: var(--warning); }
    .empty { padding: 24px 16px; color: var(--muted); font-size: var(--fs-small); }
    @media (max-width: 900px) {
      .body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="ناوبری">
    <div class="mark" title="تهران برق">TP</div>
    <a href="/city" title="نقشه شهر">MAP</a>
    <a href="/viewer" aria-current="page" title="شاردها">SHD</a>
    <a href="/dashboard" title="کلاستر">CLS</a>
    <a href="/lab" title="Actor Lab">LAB</a>
    <div class="spacer"></div>
  </nav>
  <div class="work">
    <header class="top">
      <div>
        <h1>توزیع شارد</h1>
        <div class="sub">cluster → node → shard → محله · رنگ فقط روی بار MW</div>
        <div class="sub" id="clusterBanner" style="color:var(--warning);margin-top:4px" hidden></div>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="label">Up</span><span class="value" id="sUp">—</span></div>
        <div class="kpi"><span class="label">نود UI</span><span class="value" id="sNodes">0</span></div>
        <div class="kpi"><span class="label">شارد</span><span class="value" id="sShards">0</span></div>
        <div class="kpi"><span class="label">محله</span><span class="value" id="sHouses">0</span></div>
        <div class="kpi"><span class="label">خاموش</span><span class="value bad" id="sBo">0</span></div>
        <div class="kpi"><span class="label">قطع ناظر</span><span class="value warn" id="sShed">0</span></div>
        <div class="kpi"><span class="label">مهاجرت</span><span class="value mw" id="sMig">0</span></div>
      </div>
    </header>
    <div class="body">
      <div class="node-grid" id="nodes"></div>
      <aside class="panel" id="detail">
        <div class="panel-h">
          <h2 id="detailTitle">یک شارد را انتخاب کن</h2>
          <p id="detailMeta">محله‌ها بر اساس MW نزولی؛ O روشن · B خاموشی · S قطع ناظر</p>
        </div>
        <div class="panel-b" id="entityList"><div class="empty">هنوز شاردی انتخاب نشده.</div></div>
      </aside>
    </div>
  </div>
</div>
<script>
const store = new Map();
/** houseId -> { member, shard } last known placement */
const placement = new Map();
/** houseId -> expireMs for migrate flash */
const migrated = new Map();
const MIGRATE_MS = 8000;
let selected = null;
let renderTimer = 0;

function shortMember(id) {
  if (!id) return '—';
  const m = String(id).match(/@([^:/]+)/);
  return m ? m[1] : String(id).slice(-20);
}

function removeHouseEverywhere(houseId) {
  for (const [mem, shards] of store.entries()) {
    for (const [sid, houses] of shards.entries()) {
      if (houses.has(houseId)) {
        houses.delete(houseId);
        if (!houses.size) shards.delete(sid);
      }
    }
    if (!shards.size) store.delete(mem);
  }
}

function onEvent(ev) {
  const member = ev.memberId || 'unknown';
  const shard = String(ev.shardId);
  const house = ev.houseId;
  const now = Date.now();

  if (ev.action === 'stop') {
    removeHouseEverywhere(house);
    placement.delete(house);
    migrated.delete(house);
  } else {
    const prev = placement.get(house);
    if (prev && (prev.member !== member || prev.shard !== shard)) {
      removeHouseEverywhere(house);
      migrated.set(house, now + MIGRATE_MS);
    }
    placement.set(house, { member, shard });
    if (!store.has(member)) store.set(member, new Map());
    const shards = store.get(member);
    if (!shards.has(shard)) shards.set(shard, new Map());
    shards.get(shard).set(house, {
      name: ev.name || house,
      status: ev.status || 'ONLINE',
      watts: Number(ev.watts) || 0,
      districtId: ev.districtId,
      member
    });
  }
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 120);
}

function activeMigrates() {
  const now = Date.now();
  for (const [id, exp] of [...migrated.entries()]) {
    if (exp <= now) migrated.delete(id);
  }
  return migrated.size;
}

function countsFor(houses) {
  let ok = 0, bo = 0, sh = 0;
  for (const h of houses.values()) {
    if (h.status === 'BLACKOUT') bo++;
    else if (h.status === 'SHED') sh++;
    else ok++;
  }
  return { ok, bo, sh, total: houses.size };
}

function render() {
  let nodes = 0, shardsN = 0, housesN = 0, boN = 0, shN = 0;
  const nodesEl = document.getElementById('nodes');
  const members = [...store.keys()].sort((a, b) => shortMember(a).localeCompare(shortMember(b)));
  nodesEl.innerHTML = '';

  if (!members.length) {
    nodesEl.innerHTML = '<div class="panel"><div class="empty">منتظر رویدادهای شاردینگ…</div></div>';
  }

  for (const member of members) {
    nodes++;
    const shards = store.get(member);
    const shardIds = [...shards.keys()].sort((a, b) => Number(a) - Number(b));
    let nodeHouses = 0, nodeBo = 0, nodeSh = 0, maxOk = 1;
    const rows = [];
    for (const sid of shardIds) {
      const c = countsFor(shards.get(sid));
      nodeHouses += c.total; nodeBo += c.bo; nodeSh += c.sh;
      shardsN++; housesN += c.total; boN += c.bo; shN += c.sh;
      maxOk = Math.max(maxOk, c.ok + c.bo + c.sh);
      rows.push({ sid, c });
    }

    const card = document.createElement('section');
    card.className = 'panel';
    card.innerHTML = `
      <div class="panel-h">
        <h2>${shortMember(member)}</h2>
        <p class="mono">${member}</p>
        <p>${shardIds.length} شارد · ${nodeHouses} محله · خاموش ${nodeBo} · قطع ${nodeSh}</p>
      </div>
      <div class="panel-b" data-shards></div>`;
    const wrap = card.querySelector('[data-shards]');
    for (const { sid, c } of rows) {
      const t = Math.max(1, c.total);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shard-row' + (selected && selected.member === member && selected.shard === sid ? ' sel' : '');
      const widthPct = Math.max(8, (c.total / maxOk) * 88);
      btn.innerHTML = `
        <span class="sid">shard ${sid}</span>
        <span class="bar" style="width:${widthPct}%">
          <i class="ok" style="width:${(c.ok / t) * 100}%"></i>
          <i class="bo" style="width:${(c.bo / t) * 100}%"></i>
          <i class="sh" style="width:${(c.sh / t) * 100}%"></i>
        </span>
        <span class="cnt">${c.total}</span>`;
      btn.onclick = () => { selected = { member, shard: sid }; render(); };
      wrap.appendChild(btn);
    }
    nodesEl.appendChild(card);
  }

  document.getElementById('sNodes').textContent = nodes;
  document.getElementById('sShards').textContent = shardsN;
  document.getElementById('sHouses').textContent = housesN;
  document.getElementById('sBo').textContent = boN;
  document.getElementById('sShed').textContent = shN;
  document.getElementById('sMig').textContent = String(activeMigrates());
  renderDetail();
}

function pill(st) {
  if (st === 'BLACKOUT') return '<span class="pill B">B</span>';
  if (st === 'SHED') return '<span class="pill S">S</span>';
  return '<span class="pill O">O</span>';
}

function renderDetail() {
  const title = document.getElementById('detailTitle');
  const meta = document.getElementById('detailMeta');
  const list = document.getElementById('entityList');
  if (!selected) {
    title.textContent = 'یک شارد را انتخاب کن';
    meta.textContent = 'محله‌ها بر اساس MW نزولی؛ O روشن · B خاموشی · S قطع ناظر';
    list.innerHTML = '<div class="empty">هنوز شاردی انتخاب نشده.</div>';
    return;
  }
  const houses = store.get(selected.member)?.get(selected.shard);
  if (!houses || !houses.size) {
    title.textContent = 'شارد خالی';
    list.innerHTML = '<div class="empty">موجودیتی روی این شارد نیست.</div>';
    return;
  }
  const rows = [...houses.entries()].map(([id, h]) => ({ id, ...h })).sort((a, b) => b.watts - a.watts);
  title.textContent = `${shortMember(selected.member)} · shard ${selected.shard}`;
  meta.textContent = `${rows.length} محله`;
  const now = Date.now();
  list.innerHTML = rows.map(h => {
    const mig = (migrated.get(h.id) || 0) > now;
    return `
    <div class="entity${mig ? ' migrated' : ''}">
      <div>
        <div>${mig ? '<span class="mig-tag">MOVED</span>' : ''}${h.name} ${pill(h.status)}</div>
        <div class="id">${h.id} · منطقه ${h.districtId ?? '—'} · ${shortMember(h.member || selected.member)}</div>
      </div>
      <div class="mw">${h.watts.toFixed(1)} MW</div>
    </div>`;
  }).join('');
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/viewer');
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();

let prevUp = 3;
async function pollCluster() {
  try {
    const r = await fetch('/api/cluster');
    const j = await r.json();
    const up = j.up ?? j.membersCount ?? 0;
    document.getElementById('sUp').textContent = String(up);
    const banner = document.getElementById('clusterBanner');
    if (up < 3) {
      banner.hidden = false;
      banner.textContent = 'نود کم — Up=' + up + ' · شاردها روی نودهای زنده بازتوزیع می‌شوند (node-fail demo)';
      if (prevUp >= 3) prevUp = up;
    } else {
      if (prevUp < 3) {
        banner.hidden = false;
        banner.textContent = 'هر ۳ نود Up — منتظر rebalance…';
        setTimeout(() => { banner.hidden = true; }, 4000);
      } else {
        banner.hidden = true;
      }
      prevUp = up;
    }
  } catch (_) { /* ignore */ }
}
pollCluster();
setInterval(pollCluster, 2000);
// keep migrate KPI / flash classes fresh while timers expire
setInterval(() => {
  if (migrated.size) render();
}, 1000);
</script>
</body>
</html>
